<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ScoreCard</title>
<meta name="theme-color" content="#2e7d4f">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="ScoreCard">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="icon" href="icon-192.png" type="image/png" sizes="192x192">
<link rel="apple-touch-icon" href="apple-touch-icon.png" sizes="180x180">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gochi+Hand&display=swap">
<style>
  :root {
    color-scheme: light dark;
    --brand: #2e7d4f;
    --brand-ink: #ffffff;
    --topbar: #2e7d4f;
    --topbar-ink: #ffffff;
    --bg: #ffffff;
    --ink: #1b1f1d;
    --muted: #6b746f;
    --line: #dfe4e1;
    --head: #f1f5f2;
    --foot: #e6f0e9;
    --lead: #d5ecdc;
    --danger: #b3261e;
    /* column fits a 4ch name (20px text = 5ch at the grid's 16px) + 8px padding + 28px × */
    --col: max(72px, calc(5ch + 36px));
    --card-col: 110px;
    --gap: 10px;
    --stage: #e9eeea;
    --side: 36px;
    --end: 44px;
    --total-h: 40px;
    --name-h: 44px;
    --foot-h: calc(var(--total-h) + var(--name-h));
    --row-h: 48px;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --brand: #4caf78;
      --brand-ink: #08150d;
      --topbar: #1d3b2a;
      --topbar-ink: #e8ece9;
      --bg: #121613;
      --stage: #0a0d0b;
      --ink: #e8ece9;
      --muted: #94a09a;
      --line: #2b332e;
      --head: #1b221d;
      --foot: #1f2b23;
      --lead: #25503a;
      --danger: #f2877f;
    }
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; overflow: hidden; }
  /* solid brand color behind the status bar so iOS doesn't fade the header into white */
  html { background: var(--topbar); }
  body {
    background: var(--stage);
    color: var(--ink);
    font: 16px/1.3 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    font-variant-numeric: tabular-nums;
    display: flex;
    flex-direction: column;
    height: 100dvh;
    -webkit-text-size-adjust: 100%;
  }
  button { font: inherit; color: inherit; }
  .topbar {
    flex: none;
    position: sticky; top: 0; z-index: 10;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: calc(env(safe-area-inset-top) + 12px) max(12px, env(safe-area-inset-right)) 12px max(12px, env(safe-area-inset-left));
    background: var(--topbar);
    color: var(--topbar-ink);
  }
  .topbar h1 { margin: 0; display: flex; }
  .topbar h1 svg { width: 34px; height: 34px; display: block; }
  .topbar button {
    min-height: 44px; min-width: 44px; padding: 0 14px;
    background: transparent; border: 1.5px solid currentColor; border-radius: 10px; cursor: pointer;
  }

  /* the stage centers the score card in the space between top bar and keypad */
  .stage {
    flex: 1;
    min-height: 0;
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: var(--gap);
    padding: var(--gap) max(var(--gap), env(safe-area-inset-right)) max(var(--gap), env(safe-area-inset-bottom)) max(var(--gap), env(safe-area-inset-left));
  }
  body.kp-open .stage { padding-bottom: var(--gap); }
  /* the card hugs its content and shrinks to scroll internally once it fills the stage */
  .stage { --card-w-max: calc(var(--side) + var(--end) + var(--n) * var(--card-col)); }
  .scroller {
    width: min(100%, var(--card-w-max));
    flex: 0 1 auto; min-height: 0;
    overflow: auto;
    overscroll-behavior: contain;
    -webkit-overflow-scrolling: touch;
    background: var(--bg);
    border-radius: 16px;
    box-shadow: 0 1px 2px rgba(0,0,0,.08), 0 6px 24px rgba(0,0,0,.12);
    scroll-padding: 16px var(--end) calc(var(--foot-h) + 16px) var(--side);
  }
  .sheet {
    font-family: "Gochi Hand", "Comic Sans MS", "Chalkboard SE", cursive;
    font-synthesis: none;
    width: calc(var(--side) + var(--end) + var(--n) * var(--col)); min-width: 100%;
    display: flex; flex-direction: column;
  }
  .row {
    display: grid;
    grid-template-columns: var(--side) repeat(var(--n), minmax(var(--col), 1fr)) var(--end);
    width: 100%;
    min-height: var(--row-h);
  }
  .row > * { border-bottom: 1px solid var(--line); border-right: 1px solid var(--line); min-width: 0; }
  .row > :last-child { border-right: 0; }

  /* footer: totals line on top, player names below; two rows shared by every column */
  .foot {
    position: sticky; bottom: 0; z-index: 3;
    grid-template-rows: var(--total-h) var(--name-h);
    background: var(--head); border-top: 2px solid var(--brand);
  }
  .foot > * { background: var(--head); border-bottom: 0; grid-row: 1 / -1; }
  .corner, .num {
    position: sticky; left: 0; z-index: 2;
    display: flex; align-items: center; justify-content: center;
    background: var(--bg); color: var(--muted); font-size: 20px;
  }
  .foot .corner {
    z-index: 4; display: grid; grid-template-rows: subgrid; align-items: center; justify-items: center;
    background: var(--head); color: var(--ink); font-size: 26px;
  }
  .num { padding: 0; }

  .namecell { display: grid; grid-template-columns: 1fr auto; grid-template-rows: subgrid; align-items: center; }
  .namecell input {
    grid-row: 2; min-width: calc(4ch + 8px); width: 100%; height: var(--name-h); padding: 0 0 0 8px;
    font: inherit; font-size: 20px; color: inherit; background: transparent; border: 0; border-radius: 0; outline: none;
    text-overflow: ellipsis;
  }
  .namecell .iconbtn { grid-row: 2; height: var(--name-h); }
  .iconbtn {
    flex: none; width: 28px; height: 44px; display: grid; place-items: center;
    background: transparent; border: 0; color: var(--muted); font-size: 20px; line-height: 1; cursor: pointer;
  }
  .iconbtn:active { color: var(--danger); }
  /* × and + stay pinned to the card's right edge while the grid scrolls sideways */
  .rowend {
    position: sticky; right: 0; z-index: 2;
    display: grid; place-items: center; background: var(--bg);
    box-shadow: inset 1px 0 var(--line);
  }
  .foot .rowend { z-index: 4; display: grid; grid-template-rows: subgrid; place-items: center; background: var(--head); }
  .addp {
    grid-row: 2; width: calc(var(--name-h) - 4px); aspect-ratio: 1; padding: 0; border-radius: 10px; border: 1.5px dashed var(--brand); cursor: pointer;
    background: transparent; color: var(--brand); font-size: 24px; line-height: 1;
  }

  .cell input {
    display: block; width: 100%; height: 100%; min-height: var(--row-h); padding: 0 10px;
    font: inherit; font-size: 22px; text-align: right; color: inherit; background: transparent;
    border: 0; border-radius: 0; outline: none;
  }
  .cell input:focus { background: color-mix(in srgb, var(--brand) 16%, transparent); box-shadow: inset 0 0 0 2px var(--brand); }
  .namecell:focus-within { box-shadow: inset 0 0 0 2px var(--brand); }

  .total {
    grid-column: 1 / -1; grid-row: 1; align-self: stretch;
    display: flex; align-items: center; justify-content: flex-end;
    padding: 0 10px; font-size: 26px; line-height: 1; background: var(--foot);
    border-bottom: 1px solid var(--line);
  }
  .total.lead { background: var(--lead); }

  .addround { position: sticky; left: 0; width: var(--card-w, 100%); max-width: 100%; padding: 8px 12px; display: flex; }
  .addround button {
    flex: 1; min-height: 44px; border: 1.5px dashed var(--brand); border-radius: 12px; background: transparent;
    color: var(--brand); font-size: 20px; cursor: pointer;
  }

  /* "add to home screen" hint, sitting on the background under the card */
  .install {
    flex: none; width: min(100%, var(--card-w-max));
    display: flex; align-items: center; gap: 10px;
    padding: 8px 4px 8px 12px; border-radius: 12px;
    background: color-mix(in srgb, var(--brand) 10%, transparent);
    color: var(--muted); font-size: 14px;
  }
  .install[hidden], body.kp-open .install { display: none; }
  .install p { flex: 1; margin: 0; }
  .install strong { color: var(--ink); font-weight: 600; }
  .install svg { width: 15px; height: 15px; vertical-align: -2px; color: var(--brand); }
  .install .go {
    flex: none; min-height: 36px; padding: 0 14px; border: 0; border-radius: 10px; cursor: pointer;
    background: var(--brand); color: var(--brand-ink); font-weight: 600;
  }
  .install .iconbtn { width: 36px; }

  /* on-page number pad for score cells (replaces the iOS keyboard) */
  .keypad {
    flex: none;
    display: grid; grid-template-columns: repeat(4, 1fr); grid-auto-rows: 52px; gap: 6px;
    padding: 6px max(6px, env(safe-area-inset-right)) calc(6px + env(safe-area-inset-bottom)) max(6px, env(safe-area-inset-left));
    background: var(--line);
    touch-action: manipulation; user-select: none; -webkit-user-select: none; -webkit-touch-callout: none;
  }
  .keypad[hidden] { display: none; }
  .keypad button {
    border: 0; border-radius: 10px; background: var(--bg); color: var(--ink);
    font: 400 26px/1 system-ui, -apple-system, sans-serif; cursor: pointer;
    box-shadow: 0 1px 0 rgba(0,0,0,.2);
  }
  .keypad button.fn { background: var(--head); color: var(--brand); }
  .keypad button:active { background: var(--lead); }
  .keypad .enter { grid-row: span 2; background: var(--brand); color: var(--brand-ink); }
  .keypad .enter:active { background: var(--brand); filter: brightness(1.15); }

  dialog {
    width: min(92vw, 360px); padding: 20px; border: 0; border-radius: 16px; background: var(--bg); color: var(--ink);
    box-shadow: 0 10px 40px rgba(0,0,0,.35);
  }
  dialog::backdrop { background: rgba(0,0,0,.5); }
  dialog h2 { margin: 0 0 6px; font-size: 18px; }
  dialog p { margin: 0 0 16px; color: var(--muted); }
  .actions { display: flex; flex-direction: column; gap: 8px; }
  .actions button {
    min-height: 48px; border-radius: 12px; border: 1.5px solid var(--line); background: var(--head); cursor: pointer; font-weight: 600;
  }
  .actions button.danger { background: var(--danger); border-color: var(--danger); color: #fff; }
  @media (prefers-color-scheme: dark) { .actions button.danger { color: #190806; } }
</style>
</head>
<body>
<header class="topbar">
  <h1><svg viewBox="128 128 256 256" role="img" aria-label="ScoreCard">
    <rect x="128" y="128" width="256" height="256" rx="30" fill="currentColor"/>
    <path d="M256 128v256M128 213h256M128 299h256" stroke="var(--topbar)" stroke-width="14"/>
    <path d="M168 171h48M296 171h48M168 256h48M296 256h24M168 341h24M296 341h48" stroke="var(--topbar)" stroke-width="22" stroke-linecap="round"/>
  </svg></h1>
  <button type="button" id="reset">Reset</button>
</header>
<main class="stage">
  <div class="scroller" id="scroller"><div class="sheet" id="sheet"></div></div>
  <aside class="install" id="install" hidden>
    <p id="install-ios" hidden>Install: tap <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-label="Share"><path d="M12 15V3M8 7l4-4 4 4"/><path d="M8 11H6a2 2 0 0 0-2 2v7a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-7a2 2 0 0 0-2-2h-2"/></svg> then <strong>Add to Home Screen</strong></p>
    <p id="install-prompt" hidden>Install ScoreCard on this device</p>
    <button type="button" class="go" id="install-go" hidden>Install</button>
    <button type="button" class="iconbtn" id="install-x" aria-label="Dismiss">×</button>
  </aside>
</main>
<div class="keypad" id="keypad" role="group" aria-label="Number pad" hidden>
  <button type="button" data-key="7">7</button>
  <button type="button" data-key="8">8</button>
  <button type="button" data-key="9">9</button>
  <button type="button" class="fn" data-key="back" aria-label="Delete">⌫</button>
  <button type="button" data-key="4">4</button>
  <button type="button" data-key="5">5</button>
  <button type="button" data-key="6">6</button>
  <button type="button" class="fn" data-key="down" aria-label="Next round">↵</button>
  <button type="button" data-key="1">1</button>
  <button type="button" data-key="2">2</button>
  <button type="button" data-key="3">3</button>
  <button type="button" class="enter" data-key="right" aria-label="Next player">→</button>
  <button type="button" class="fn" data-key="sign" aria-label="Flip sign">±</button>
  <button type="button" data-key="0">0</button>
  <button type="button" class="fn" data-key=".">.</button>
</div>
<dialog id="dlg">
  <h2 id="dlg-title"></h2>
  <p id="dlg-text"></p>
  <div class="actions" id="dlg-actions"></div>
</dialog>

<script type="module">
const KEY = 'scorecard:v1';
const $ = (id) => document.getElementById(id);
const sheet = $('sheet'), scroller = $('scroller');
const uid = (p) => p + '_' + Math.random().toString(36).slice(2, 9);
const newRound = () => ({ id: uid('r'), scores: {} });

function defaultState() {
  return {
    players: [{ id: uid('p'), name: 'Player 1' }, { id: uid('p'), name: 'Player 2' }],
    rounds: [newRound(), newRound(), newRound()],
  };
}

function load() {
  try {
    const s = JSON.parse(localStorage.getItem(KEY));
    if (!s || !Array.isArray(s.players) || !Array.isArray(s.rounds)) return defaultState();
    const players = s.players.filter((p) => p && typeof p.id === 'string')
      .map((p) => ({ id: p.id, name: String(p.name ?? '').slice(0, 20) }));
    if (!players.length) return defaultState();
    const rounds = s.rounds.filter((r) => r && typeof r.id === 'string').map((r) => {
      const scores = {};
      for (const p of players) {
        const v = r.scores && r.scores[p.id];
        if (typeof v === 'number' && isFinite(v)) scores[p.id] = v;
      }
      return { id: r.id, scores };
    });
    return { players, rounds };
  } catch { return defaultState(); }
}

let state = load();
const save = () => { try { localStorage.setItem(KEY, JSON.stringify(state)); } catch {} };

// ---------- helpers ----------
function el(tag, cls, attrs = {}) {
  const e = document.createElement(tag);
  if (cls) e.className = cls;
  for (const [k, v] of Object.entries(attrs)) e.setAttribute(k, v);
  return e;
}
const fmt = (n) => (Math.round(n * 1e6) / 1e6).toString().replace('-', '−');
const hasScores = (r) => Object.keys(r.scores).length > 0;

// Clean raw text in a score box (keypad or hardware keyboard); returns [text, number|null].
const MAX_DIGITS = 9;
function clean(raw) {
  let t = raw.replace(/−/g, '-').replace(/,/g, '.').replace(/[^0-9.\-]/g, '');
  const neg = t.startsWith('-');
  t = t.replace(/-/g, '');
  const i = t.indexOf('.');
  if (i >= 0) t = t.slice(0, i + 1) + t.slice(i + 1).replace(/\./g, '');
  t = t.slice(0, MAX_DIGITS);
  const text = (neg ? '-' : '') + t;
  const num = /^-?(\d+\.?\d*|\.\d+)$/.test(text) ? parseFloat(text) : null;
  return [text, num];
}

// ---------- rendering ----------
let totalEls = {};

// --n lives on the stage so the card and the install hint share the same width
function setCols() { scroller.parentElement.style.setProperty('--n', state.players.length); }
// remember whether the card is scrolled to the newest round
let pinnedBottom = true;
scroller.addEventListener('scroll', () => {
  pinnedBottom = scroller.scrollHeight - scroller.scrollTop - scroller.clientHeight < 4;
}, { passive: true });
new ResizeObserver(() => {
  // keep "+ Add round" as wide as the visible card while the grid scrolls sideways
  scroller.style.setProperty('--card-w', scroller.clientWidth + 'px');
  // card resized (install hint, keypad, rotation): stay on the newest round unless a cell is being edited
  if (pinnedBottom && !document.activeElement?.dataset?.score) scroller.scrollTop = scroller.scrollHeight;
}).observe(scroller);

function footRow() {
  const row = el('div', 'row foot');
  const corner = el('div', 'corner');
  corner.append(Object.assign(el('span'), { textContent: '=' }));
  row.append(corner);
  totalEls = {};
  for (const p of state.players) {
    const c = el('div', 'namecell');
    const inp = el('input', '', { type: 'text', 'aria-label': 'Player name', maxlength: 20, placeholder: 'Name', enterkeyhint: 'done', autocomplete: 'off' });
    inp.value = p.name;
    inp.dataset.pid = p.id;
    c.append(inp);
    if (state.players.length > 1) {
      const x = el('button', 'iconbtn', { type: 'button', 'aria-label': 'Remove player' });
      x.textContent = '×';
      x.dataset.removePlayer = p.id;
      c.append(x);
    }
    const t = el('div', 'total');
    totalEls[p.id] = t;
    c.append(t);
    row.append(c);
  }
  const end = el('div', 'rowend');
  const add = el('button', 'addp', { type: 'button', 'aria-label': 'Add player' });
  add.textContent = '+';
  add.id = 'addPlayer';
  end.append(add);
  row.append(end);
  return row;
}

function roundRow(r, idx) {
  const row = el('div', 'row');
  row.dataset.rid = r.id;
  const num = el('div', 'num');
  num.textContent = idx + 1;
  row.append(num);
  for (const p of state.players) {
    const c = el('div', 'cell');
    const inp = el('input', '', { type: 'text', inputmode: 'none', autocomplete: 'off', 'aria-label': `Round ${idx + 1}, ${p.name || 'player'}` });
    inp.dataset.rid = r.id;
    inp.dataset.pid = p.id;
    inp.dataset.score = '1';
    if (typeof r.scores[p.id] === 'number') inp.value = fmt(r.scores[p.id]).replace('−', '-');
    c.append(inp);
    row.append(c);
  }
  const end = el('div', 'rowend');
  const x = el('button', 'iconbtn', { type: 'button', 'aria-label': `Remove round ${idx + 1}` });
  x.textContent = '×';
  x.dataset.removeRound = r.id;
  end.append(x);
  row.append(end);
  return row;
}

function render() {
  setCols();
  sheet.replaceChildren(
    ...state.rounds.map(roundRow),
    (() => {
      const w = el('div', 'addround');
      const b = el('button', '', { type: 'button' });
      b.id = 'addRound';
      b.textContent = '+ Add round';
      w.append(b);
      return w;
    })(),
    footRow(),
  );
  updateTotals();
}

const scrollToBottom = (behavior = 'auto') => scroller.scrollTo({ top: scroller.scrollHeight, behavior });

function updateTotals() {
  const sums = {};
  let any = false;
  for (const p of state.players) sums[p.id] = 0;
  for (const r of state.rounds) for (const p of state.players) {
    const v = r.scores[p.id];
    if (typeof v === 'number') { sums[p.id] += v; any = true; }
  }
  const max = Math.max(...Object.values(sums));
  for (const p of state.players) {
    const t = totalEls[p.id];
    t.textContent = fmt(sums[p.id]);
    t.classList.toggle('lead', any && state.players.length > 1 && sums[p.id] === max);
  }
}

// ---------- dialog ----------
const dlg = $('dlg');
function ask(title, text, actions) {
  return new Promise((resolve) => {
    $('dlg-title').textContent = title;
    $('dlg-text').textContent = text;
    const box = $('dlg-actions');
    box.replaceChildren();
    const mk = (label, value, cls) => {
      const b = el('button', cls, { type: 'button' });
      b.textContent = label;
      b.onclick = () => dlg.close(value);
      box.append(b);
    };
    actions.forEach((a) => mk(a.label, a.value, a.danger ? 'danger' : ''));
    mk('Cancel', '');
    dlg.onclose = () => resolve(dlg.returnValue || '');
    dlg.returnValue = '';
    dlg.showModal();
  });
}

// ---------- events ----------
// → : next player in the round, wrapping to the next round
function nextInput(from) {
  const all = [...sheet.querySelectorAll('input[data-score]')];
  return all[all.indexOf(from) + 1] || null;
}
// ↵ : same player, next round
function belowInput(from) {
  const row = from.closest('.row')?.nextElementSibling;
  return row?.querySelector(`input[data-score][data-pid="${from.dataset.pid}"]`) || null;
}
const go = (from, to) => { if (to) { to.focus(); to.scrollIntoView({ block: 'nearest' }); } else from.blur(); };

sheet.addEventListener('input', (e) => {
  const t = e.target;
  if (t.dataset.pid && !t.dataset.score) {
    const p = state.players.find((q) => q.id === t.dataset.pid);
    if (p) { p.name = t.value.slice(0, 20); save(); }
    return;
  }
  if (!t.dataset.score) return;
  const [text, num] = clean(t.value);
  if (t.value !== text) t.value = text;
  const ri = state.rounds.findIndex((r) => r.id === t.dataset.rid);
  if (ri < 0) return;
  const r = state.rounds[ri];
  if (num === null) delete r.scores[t.dataset.pid]; else r.scores[t.dataset.pid] = num;
  if (num !== null && ri === state.rounds.length - 1) {
    const nr = newRound();
    state.rounds.push(nr);
    const row = roundRow(nr, state.rounds.length - 1);
    sheet.querySelector('.addround').before(row);
    // reveal the new round just above the footer (scroll-padding accounts for it)
    row.scrollIntoView({ block: 'nearest', behavior: 'smooth' });
  }
  save();
  updateTotals();
});

sheet.addEventListener('keydown', (e) => {
  if (e.key !== 'Enter') return;
  e.preventDefault();
  const t = e.target;
  if (t.dataset.score) go(t, belowInput(t));
  else t.blur();
});

// select the whole value on focus so typing replaces it
sheet.addEventListener('focusin', (e) => {
  const t = e.target;
  if (t.tagName !== 'INPUT') return;
  t.addEventListener('mouseup', (ev) => ev.preventDefault(), { once: true });
  setTimeout(() => t.select(), 0);
  if (t.dataset.score && keypad.hidden) {
    keypad.hidden = false;
    document.body.classList.add('kp-open');
    // the keypad shrinks the scroller; keep the active cell in view
    requestAnimationFrame(() => t.scrollIntoView({ block: 'nearest' }));
  }
});
sheet.addEventListener('focusout', (e) => {
  if (!e.target.dataset.score) return;
  setTimeout(() => {
    if (document.activeElement?.dataset?.score) return;
    keypad.hidden = true;
    document.body.classList.remove('kp-open');
  }, 0);
});

// ---------- keypad ----------
const keypad = $('keypad');
function press(k) {
  const a = document.activeElement;
  if (!a?.dataset?.score) return;
  if (k === 'right') return go(a, nextInput(a));
  if (k === 'down') return go(a, belowInput(a));
  let v = a.value, s = a.selectionStart ?? v.length, e = a.selectionEnd ?? v.length;
  if (k === 'back') {
    if (s === e && s > 0) s--;
    v = v.slice(0, s) + v.slice(e);
  } else if (k === 'sign') {
    const neg = v.startsWith('-');
    v = neg ? v.slice(1) : '-' + v;
    s = e = Math.max(0, e + (neg ? -1 : 1));
  } else {
    v = v.slice(0, s) + k + v.slice(e);
    s++;
  }
  a.value = v;
  a.setSelectionRange(s, s);
  a.dispatchEvent(new Event('input', { bubbles: true }));
  // clean() may have shortened the value; keep the caret inside it
  const c = Math.min(s, a.value.length);
  a.setSelectionRange(c, c);
}
// act on pointerdown and swallow the focus change so the cell stays active
keypad.addEventListener('pointerdown', (e) => {
  e.preventDefault();
  const b = e.target.closest('button[data-key]');
  if (b) press(b.dataset.key);
});
for (const type of ['mousedown', 'touchstart']) {
  keypad.addEventListener(type, (e) => e.preventDefault(), { passive: false });
}
// iOS doesn't blur an input when tapping blank space, so close the keypad explicitly
document.addEventListener('pointerdown', (e) => {
  const a = document.activeElement;
  if (a?.dataset?.score && !e.target.closest('#keypad, input')) a.blur();
});

sheet.addEventListener('click', async (e) => {
  const btn = e.target.closest('button');
  if (!btn) return;
  if (btn.id === 'addPlayer') {
    state.players.push({ id: uid('p'), name: `Player ${state.players.length + 1}` });
    save(); render();
    scroller.scrollTo({ left: scroller.scrollWidth, top: scroller.scrollHeight, behavior: 'smooth' });
  } else if (btn.id === 'addRound') {
    state.rounds.push(newRound());
    save(); render();
    scrollToBottom('smooth');
  } else if (btn.dataset.removePlayer) {
    const id = btn.dataset.removePlayer;
    const p = state.players.find((q) => q.id === id);
    const scored = state.rounds.some((r) => typeof r.scores[id] === 'number');
    if (scored) {
      const v = await ask(`Remove ${p.name || 'player'}?`, 'Their scores will be deleted.', [{ label: 'Remove', value: 'y', danger: true }]);
      if (!v) return;
    }
    state.players = state.players.filter((q) => q.id !== id);
    for (const r of state.rounds) delete r.scores[id];
    save(); render();
  } else if (btn.dataset.removeRound) {
    const id = btn.dataset.removeRound;
    const i = state.rounds.findIndex((r) => r.id === id);
    if (i < 0) return;
    if (hasScores(state.rounds[i])) {
      const v = await ask(`Remove round ${i + 1}?`, 'Its scores will be deleted.', [{ label: 'Remove', value: 'y', danger: true }]);
      if (!v) return;
    }
    state.rounds.splice(i, 1);
    save(); render();
  }
});

$('reset').addEventListener('click', async () => {
  const v = await ask('Reset game?', 'Clear scores keeps the players. Start over also resets the players.', [
    { label: 'Clear scores', value: 'clear', danger: true },
    { label: 'Start over', value: 'over', danger: true },
  ]);
  if (v === 'clear') state = { players: state.players, rounds: [newRound(), newRound(), newRound()] };
  else if (v === 'over') state = defaultState();
  else return;
  save(); render();
  scroller.scrollTo({ left: 0, top: scroller.scrollHeight });
});

// ---------- install hint ----------
// iOS has no install API, so show instructions; Chromium browsers fire beforeinstallprompt.
{
  const DISMISS_KEY = 'scorecard:install-dismissed';
  const box = $('install');
  const standalone = matchMedia('(display-mode: standalone)').matches || navigator.standalone === true;
  let dismissed = false;
  try { dismissed = localStorage.getItem(DISMISS_KEY) === '1'; } catch {}
  const ios = /iPhone|iPad|iPod/.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
  let deferred = null;
  const hide = () => { box.hidden = true; };

  if (!standalone && !dismissed) {
    if (ios) {
      $('install-ios').hidden = false;
      box.hidden = false;
    }
    addEventListener('beforeinstallprompt', (e) => {
      e.preventDefault();
      deferred = e;
      $('install-ios').hidden = true;
      $('install-prompt').hidden = false;
      $('install-go').hidden = false;
      box.hidden = false;
    });
  }
  $('install-go').addEventListener('click', async () => {
    if (!deferred) return;
    deferred.prompt();
    await deferred.userChoice;
    deferred = null;
    hide();
  });
  $('install-x').addEventListener('click', () => {
    try { localStorage.setItem(DISMISS_KEY, '1'); } catch {}
    hide();
  });
  addEventListener('appinstalled', hide);
}

render();
scrollToBottom();
</script>
</body>
</html>
